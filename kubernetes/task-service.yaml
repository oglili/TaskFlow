apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: YOUR_DOCKERHUB_USERNAME/taskflow-task-service:1.0
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20  
          env:
            - name: PORT
              value: "3002"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: MONGODB_URI
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: DATABASE_NAME
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: USER_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
spec:
  type: NodePort
  selector:
    app: task-service
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30082
